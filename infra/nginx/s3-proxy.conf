# Фрагмент для server { } домена taxi.rulplus.ru.
# S3 API остаётся на 127.0.0.1:9000; телефоны ходят сюда по HTTPS.
# В server/.env: S3_PUBLIC_ENDPOINT=https://taxi.rulplus.ru/s3
#
# include /var/www/test-app/NurTaxi/infra/nginx/s3-proxy.conf;

location /s3/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 25m;
    chunked_transfer_encoding off;
}
