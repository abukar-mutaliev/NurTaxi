# Фрагмент для server { } домена taxi.rulplus.ru (блок с listen 443).
# S3 API остаётся на 127.0.0.1:9000; телефоны ходят сюда по HTTPS.
# В server/.env: S3_PUBLIC_ENDPOINT=https://taxi.rulplus.ru (без пути!)
#
# Путь запроса переписывать нельзя. Presigned URL подписан по AWS SigV4, и в подпись
# входит путь целиком: если nginx срежет префикс (proxy_pass с завершающим «/»),
# MinIO увидит другой путь, пересчитает подпись и ответит 403 SignatureDoesNotMatch —
# в приложении это выглядит как «Не удалось загрузить файл» на любом фото.
# Поэтому location совпадает с именем бакета (S3_BUCKET), а proxy_pass — без слэша.
#
# include /var/www/NurTaxi/infra/nginx/s3-proxy.conf;

location /nurtaxi-documents/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 25m;
    chunked_transfer_encoding off;
}
