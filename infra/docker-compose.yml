# Локальное dev-окружение Nur Taxi (Des §3).
# Запуск ядра:            docker compose up -d
# С наблюдаемостью:       docker compose --profile observability up -d
#
# На машине с белым IP этот файл один нельзя: порты данных уйдут в интернет.
# Там: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# и свои MINIO_ROOT_USER / MINIO_ROOT_PASSWORD в infra/.env.
name: nurtaxi

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nurtaxi-postgres
    environment:
      POSTGRES_USER: nurtaxi
      POSTGRES_PASSWORD: nurtaxi
      POSTGRES_DB: nurtaxi
    ports:
      # Хостовый порт 5433, чтобы не конфликтовать с другими локальными Postgres (5432).
      # Только localhost: на 0.0.0.0 этот порт с паролем из compose открывает всю БД.
      - '127.0.0.1:5433:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nurtaxi -d nurtaxi']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nurtaxi-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # Хостовый порт 6380, чтобы не конфликтовать с другими локальными Redis (6379).
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: nurtaxi-nats
    command: ['-js', '-m', '8222']
    ports:
      - '127.0.0.1:4222:4222' # клиентский протокол
      - '127.0.0.1:8222:8222' # мониторинг
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nurtaxi-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # Пароль по умолчанию годится только для локальной машины. На любом сервере задайте
      # свой через переменные окружения — в хранилище лежат паспорта и права водителей.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nurtaxi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nurtaxi123}
    ports:
      # S3 API по умолчанию на всех интерфейсах — телефон в той же Wi‑Fi сети должен
      # до него достучаться. На сервере задайте MINIO_API_BIND=127.0.0.1 и проксируйте
      # через nginx (infra/nginx/s3-proxy.conf), иначе API с паролем из репозитория
      # отдаёт документы без консоли.
      - '${MINIO_API_BIND:-0.0.0.0}:9000:9000'
      # Консоль слушает только саму машину: наружу ей выходить незачем.
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Одноразовый инициализатор бакета для документов водителей.
  minio-init:
    image: minio/mc:latest
    container_name: nurtaxi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nurtaxi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nurtaxi123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/nurtaxi-documents &&
      mc anonymous set none local/nurtaxi-documents &&
      echo 'MinIO bucket ready';
      "

  # --- Опциональный стек наблюдаемости (профиль observability) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: nurtaxi-prometheus
    profiles: ['observability']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'

  grafana:
    image: grafana/grafana:latest
    container_name: nurtaxi-grafana
    profiles: ['observability']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: nurtaxi-otel-collector
    profiles: ['observability']
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP

  # OSRM — маршрутизация по дорогам (СКФО, включая Ингушетию).
  # Подготовка данных (один раз): infra/osrm/prepare-data.ps1 или prepare-data.sh
  # Запуск: docker compose --profile osrm up -d osrm
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: nurtaxi-osrm
    profiles: ['osrm']
    ports:
      - '127.0.0.1:5001:5000'
    volumes:
      - ./osrm/data:/data
    command: osrm-routed --algorithm mld /data/north-caucasus-fed-district-latest.osm.pbf
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          'http://localhost:5000/route/v1/driving/44.7667,43.2167;44.8133,43.1687?overview=false',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  pg-data:
  redis-data:
  minio-data:
